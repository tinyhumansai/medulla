name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: ./.github/actions/native-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # Submodule SHAs are part of the build input but not of Cargo.lock,
          # so without this a submodule bump reuses a stale cache.
          key: ${{ hashFiles('.gitmodules') }}-${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      # The e2e suite exercises the real opencode CLI when it is on PATH.
      # CI builds it from git (pinned to the version used for benchmarking)
      # so that leg runs here instead of skipping.
      - uses: oven-sh/setup-bun@v2

      - name: Install opencode from git
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.17.18 https://github.com/sst/opencode /tmp/opencode
          (cd /tmp/opencode && bun install --frozen-lockfile)
          sudo tee /usr/local/bin/opencode > /dev/null <<'SH'
          #!/bin/sh
          exec bun run /tmp/opencode/packages/opencode/src/index.ts "$@"
          SH
          sudo chmod +x /usr/local/bin/opencode
          opencode --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check public boundary
        run: bash scripts/check-public-boundary.sh

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        timeout-minutes: 20
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --all-targets

  coverage:
    name: Coverage (>= 80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: ./.github/actions/native-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # Submodule SHAs are part of the build input but not of Cargo.lock,
          # so without this a submodule bump reuses a stale cache.
          key: ${{ hashFiles('.gitmodules') }}-${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Gate reusable SDK and UI logic at 95%. The excluded files are the
      # process/terminal/network drivers themselves: they depend on OS terminal
      # state or a live Socket.IO/tiny.place connection and are exercised
      # separately by the binary subprocess + direct-PTY E2E suite (`e2e_cli`)
      # and the live staging hub run, while their pure state machines, routing,
      # and data types remain counted. The orchestrator-hub split keeps the
      # dispatch runner + roster resolution + data types counted; only the
      # connect/boot/relay/handle IO drivers and the TUI hub wiring are excluded.
      # Daemon entry/transport, backend worker operations, wrapper run/bridge,
      # and the harness PTY module are likewise process or network adapters;
      # their reusable types and helpers remain counted in their sibling modules.
      # `worker_loop` joins them for the same reason `app_loop`/`event_loop` are
      # there: it is the worker TUI's entry point and tick loop, driving a real
      # terminal and real PTYs, and it is covered by the E2E suite instead.
      # `main` is the binary entry point — the thin dispatcher that wires the
      # four already-excluded drivers together — so it is excluded with them.
      # `executor_tests/live.rs` is the interactive-codex smoke/acceptance suite:
      # every test in it is `#[ignore]` because it needs a real authed `codex`
      # binary plus network, so it never runs in CI and its lines can only be
      # exercised by the live run — the same reason the drivers above are excluded.
      - name: Coverage gate
        timeout-minutes: 100
        run: >-
          cargo llvm-cov --locked
          --ignore-filename-regex '(^|/)vendor/|src/tui/src/(app_loop|commands|main)\.rs|src/tui/src/(event_loop|terminal|hub_relay|worker_loop)(/.*)?\.rs|src/tui/src/harness_pty/mod\.rs|src/tui/src/ui/onboarding/run(/.*)?\.rs|src/tui/src/ui/app/render/tasks\.rs|src/tui/src/worker/executor_tests/live\.rs|src/sdk/src/daemon/(entry\.rs|transport/mod\.rs)|src/sdk/src/wrapper/(run|bridge)/mod\.rs|src/sdk/src/hub/(socket|relay)\.rs|src/sdk/src/hub/(boot|handle)(/.*)?\.rs'
          --fail-under-lines 80
          --summary-only

  embedded-core:
    name: Vendored core resolution
    runs-on: ubuntu-latest
    # The vendored core roughly triples compile wall-clock on a cold cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ hashFiles('.gitmodules') }}-${{ hashFiles('rust-toolchain.toml') }}-embedded
          cache-on-failure: true

      - uses: ./.github/actions/native-deps

      # The core is unconditional now, so this check duplicates what every
      # other lane compiles. It stays because the guards below are what this
      # lane is really for, and they need a resolved graph to inspect.
      - name: Check with the embedded core enabled
        run: cargo check --locked

      # Guards the failure modes that do not announce themselves: two copies of
      # a vendored crate (an E0308 where the types look identical), a tinyagents
      # that silently resolved from the registry instead of the vendored tree,
      # and duplicate ratatui/crossterm (two raw-mode state machines on one tty).
      - name: Guard against duplicate and misresolved vendored crates
        run: |
          set -euo pipefail
          dupes=$(cargo tree -d | grep -E '^(tiny[a-z]+|ratatui|crossterm|rustls|ring|aws-lc-rs) v' || true)
          if [ -n "$dupes" ]; then
            echo "Duplicate packages that must be unified:"; echo "$dupes"; exit 1
          fi
          if ! cargo tree -i tinyagents | head -1 | grep -q 'vendor/openhuman/vendor/tinyagents'; then
            echo "tinyagents did not resolve to the vendored tree:"
            cargo tree -i tinyagents | head -1
            exit 1
          fi
          echo "OK: one copy of each vendored crate, resolved from vendor/openhuman."

  e2e-docker:
    name: E2E (docker + tmux + opencode)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: docker/setup-buildx-action@v3

      # Build the harness image once with a GHA layer cache (the Rust build
      # stage is the expensive layer; warm runs skip it entirely), then run the
      # suites in fully network-isolated containers via run-docker.sh.
      - name: Build harness image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/coordination/Dockerfile
          tags: medulla-e2e:latest
          load: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Coordination round trip (run.sh, --network none)
        run: SKIP_BUILD=1 bash e2e/coordination/run-docker.sh

      - name: Functional scenarios (tests.sh, --network none)
        run: docker run --rm --network none medulla-e2e:latest bash /app/e2e/coordination/tests.sh

      - name: Multi-agent scenarios (tests_multi.sh, --network none)
        run: docker run --rm --network none medulla-e2e:latest bash /app/e2e/coordination/tests_multi.sh

  rust-sdk-windows:
    name: Rust SDK (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # Submodule SHAs are part of the build input but not of Cargo.lock,
          # so without this a submodule bump reuses a stale cache.
          key: ${{ hashFiles('.gitmodules') }}-${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      # No bun/opencode leg here: the core-socket runtime and the `/bin/sh`
      # e2e suites are unix-only (gated `#[cfg(unix)]`), so Windows just needs
      # the crate to compile and its cross-platform lib tests to pass.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test (lib)
        timeout-minutes: 20
        run: cargo test --locked --lib
