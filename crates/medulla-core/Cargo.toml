[package]
name = "medulla"
description = "Medulla client SDK: backend HTTP/SSE client, runtimes, and the coding-agent daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "medulla"
path = "src/lib.rs"

[features]
default = ["workflows"]
# The workflow engine and everything built on it. Kept behind a feature so a
# slim build can drop the engine and its jq expression stack; on by default
# because the shipped TUI exposes workflows.
workflows = ["dep:tinyflows"]
# Opts embedded runtime tool-output compaction into the pinned TinyJuice module.
tinyjuice = ["medulla-juice/tinyjuice", "openhuman-embed/modules"]
# Test-only. Restores a single escape hatch — `MEDULLA_API_URL` — so the offline
# end-to-end suites can point a spawned `medulla` binary at a local stub backend.
# Off by default and never enabled for a shipped build, so the endpoint stays
# pinned (see `config::urls`) everywhere it matters. Enabling this in a real
# build re-opens the redirect the pin exists to close.
test-endpoint-override = []

[dependencies]
medulla-types = { workspace = true }
medulla-juice = { workspace = true }
medulla-providers = { path = "../medulla-providers", features = ["proxy"] }
medulla-tokens = { workspace = true }
# The host-link transport (docs/host-link-protocol.md) — how this SDK reaches a
# remote host. See `crates/medulla-core/src/bridge/link.rs`.
medulla-link = { workspace = true }
medulla-pty = { workspace = true }
medulla-harness = { workspace = true }
# The backend transport. `client` is a typed surface over this, not a second
# HTTP client: credential headers, the `{success,data}` envelope, path
# percent-encoding, and the not-exposed-route gate all live in the SDK.
tinyhumans-sdk = { workspace = true }
tinyflows = { workspace = true, optional = true }
# Native agents share one process-owned OpenHuman runtime.
openhuman-embed = { workspace = true }
medulla-monitor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
agent-client-protocol = { workspace = true }
rust_socketio = { version = "0.6", features = ["async"] }
dirs = { workspace = true }
fs2 = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
# Crash reporting (`observability`); see the workspace note on its features.
sentry = { workspace = true }

tempfile = { workspace = true }

sysinfo = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = { workspace = true }
# `test-util` gives the tests a paused clock. The host-link timeout gate
# (docs/host-link-protocol.md §6.3) is tested over multi-second windows, which
# only stay a unit test because time can be advanced rather than waited out.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
