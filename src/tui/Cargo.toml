[package]
name = "medulla-tui"
description = "Medulla terminal UI: chat with the orchestrator, watch agent lanes, drive the daemon and wrappers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "medulla_tui"
path = "src/lib.rs"

[[bin]]
name = "medulla"
path = "src/main.rs"

[features]
default = ["workflows"]
# Mirrors the SDK's feature so the app's workflow page and command compile in
# and out with the engine behind them. Without this the `cfg` blocks here would
# silently evaluate false, since a crate only sees its *own* features.
workflows = ["medulla/workflows"]
# Mirrors the SDK's test-only endpoint hatch; see its note there. The e2e login
# suite is `#[ignore]`d unless this is on, because it cannot reach its stub
# backend without it.
test-endpoint-override = ["medulla/test-endpoint-override"]

[dependencies]
medulla = { workspace = true, default-features = false }
# The host-link transport: `main.rs` brings the link up before handing the
# worker loop a bridge over it.
medulla-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
vte = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
sysinfo = { workspace = true }
# Grapheme clustering for rebuilding terminal cells from a wire run. A cell holds
# one cluster (see `worker/pty/cell_text.rs`), which scalar-by-scalar iteration
# cannot reproduce: a ZWJ emoji or a flag is several scalars in one cell.
unicode-segmentation = "1"
# The advisory lock that closes the enroll-then-connect window on a remote
# host; the link crate uses the same one for its identity lock.
fs2 = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `setsid` and `dup2`, for detaching a remote daemon from the SSH session that
# started it. Unix only, like the daemon itself.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
